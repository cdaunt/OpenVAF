name: OSDI 0.5 compiler artifacts

on:
  push:
    branches: [mb-experimental]
  pull_request:
    paths:
      - 'openvaf/**'
      - 'ci/compiler/**'
      - 'Cargo.lock'
      - 'pixi.toml'
      - 'pixi.lock'
      - '.github/workflows/compiler-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux
          - os: macos-15
            target: aarch64-macos
          - os: macos-15-intel
            target: x86_64-macos
          - os: windows-2022
            target: x86_64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt
      - name: Check affine fix formatting
        run: rustfmt +1.94.0 --edition 2021 --check openvaf/sim_back/src/jacobian_const.rs
      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.76.1
          locked: true
          cache: false
      - name: Build compiler in locked LLVM environment
        run: pixi run build
      - name: Check source compiler metadata
        run: |
          binary=target/release/openvaf-r
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          pixi run python ci/compiler/check_metadata.py "$binary" build/metadata-check
      - name: Package portable compiler with runtime libraries and linker
        run: |
          binary=target/release/openvaf-r
          if [[ "$RUNNER_OS" == Windows ]]; then binary="$binary.exe"; fi
          pixi run python ci/compiler/package.py "$binary" '${{ matrix.target }}'
      - name: Verify relocated archive without build environment or tools
        run: |
          for archive in build/compiler-dist/openvaf-r-osdi05-*.zip; do
            python ci/compiler/verify_portable.py "$archive" .pixi/envs/default
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openvaf-r-osdi05-${{ matrix.target }}-${{ github.sha }}
          path: build/compiler-dist/*
          if-no-files-found: error
          retention-days: 30
